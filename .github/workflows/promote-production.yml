name: Verify and promote production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vault-production
  cancel-in-progress: false

jobs:
  test-and-promote:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server and browser code
        run: npm run check

      - name: Promote verified commit
        run: git push origin "${GITHUB_SHA}:refs/heads/production"

